repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0  # Use the latest stable version
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: https://github.com/detailyang/pre-commit-nodejs
    rev: v1.7.1  # Use the latest stable version
    hooks:
      - id: node-no-unpublished
      - id: node-no-extraneous

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.18.0  # Use the version of ESLint you are using in your project
    hooks:
      - id: eslint
        args: [--ext, .ts,.tsx]  # Include TypeScript files

  - repo: https://github.com/typestack/pre-commit-tsc
    rev: v0.1.0
    hooks:
      - id: tsc
        args: [--noEmit]  # Only check for TypeScript errors, do not emit output

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.0  # Match Prettier version in your project
    hooks:
      - id: prettier
        args: [--write, .]
